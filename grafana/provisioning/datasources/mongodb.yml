apiVersion: 1

datasources:
  - name: MongoDB-TourismAnalytics
    type: grafana-mongodb-datasource
    access: proxy
    url: mongodb://grafana_user:grafana_password@mongo:27017/tourism_analytics
    isDefault: true
    editable: true
    jsonData:
      authType: "credentials"
      database: "tourism_analytics"
      connectionString: "mongodb://grafana_user:grafana_password@mongo:27017/tourism_analytics"
    secureJsonData:
      username: "grafana_user"
      password: "grafana_password" 