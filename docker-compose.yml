services:
  zookeeper:
    image: bitnami/zookeeper:latest
    container_name: my-zookeeper
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    ports:
      - "22181:2181"
    networks:
      - kafka-network

  kafka:
    image: bitnami/kafka:3.5
    container_name: my-kafka
    environment:
      - KAFKA_CFG_BROKER_ID=1
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    networks:
      - kafka-network

  mongo:
    image: mongo:latest
    container_name: my-mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password123
      - MONGO_INITDB_DATABASE=tourism_analytics
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d
    networks:
      - kafka-network

  # API intermedia para MongoDB
  mongo-api:
    build:
      context: ./mongo-api
      dockerfile: Dockerfile
    container_name: mongo-api
    environment:
      - MONGO_URI=mongodb://admin:password123@mongo:27017/tourism_analytics?authSource=admin
      - DB_NAME=tourism_analytics
      - NODE_ENV=production
      - PORT=8080
      - ALLOWED_ORIGINS=http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      - mongo
    networks:
      - kafka-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: my-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_INSTALL_PLUGINS=yesoreyeram-infinity-datasource,grafana-clock-panel,grafana-worldmap-panel,grafana-piechart-panel
      - GF_FEATURE_TOGGLES_ENABLE=publicDashboards
      - GF_DASHBOARDS_MIN_REFRESH_INTERVAL=1s
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - mongo-api
    networks:
      - kafka-network
    restart: unless-stopped

volumes:
  mongo_data:
  grafana_data:

networks:
  kafka-network:
    driver: bridge